<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>grain-gradient playground</title>
    <meta
      name="description"
      content="Tune grain-gradient presets locally with a fast, dependency-free playground."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="grain-gradient" />
    <meta property="og:title" content="grain-gradient playground" />
    <meta
      property="og:description"
      content="Tune lightweight mesh gradients with SVG turbulence grain."
    />
    <meta property="og:url" content="https://aomona.github.io/grain-gradient/playground/" />
    <meta
      property="og:image"
      content="https://aomona.github.io/grain-gradient/grain-gradient-og.png"
    />
    <meta
      property="og:image:alt"
      content="grain-gradient playground showing a grainy mesh gradient preview and controls."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="grain-gradient playground" />
    <meta
      name="twitter:description"
      content="Tune lightweight mesh gradients with SVG turbulence grain."
    />
    <meta
      name="twitter:image"
      content="https://aomona.github.io/grain-gradient/grain-gradient-og.png"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070708;
        --sidebar: #0f0f10;
        --panel: #151518;
        --panel-2: #111113;
        --line: #27272a;
        --line-strong: #3f3f46;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #e4e4e7;
        --accent-soft: rgba(228, 228, 231, 0.12);
        --danger: #fca5a5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        overflow: hidden;
      }

      .sidebar {
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        padding: 18px 16px;
        overflow: auto;
      }

      .brand {
        margin: 0 0 18px;
      }

      .brand h1 {
        margin: 0 0 6px;
        font-size: 1rem;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      .card {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 14px;
        padding: 12px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field + .field {
        margin-top: 10px;
      }

      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      label {
        font-size: 0.78rem;
        color: var(--text);
        letter-spacing: 0.02em;
      }

      .value {
        color: var(--muted);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }

      .info-mark {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1;
        cursor: help;
      }

      .info-mark::after {
        content: attr(data-tooltip);
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        z-index: 10;
        width: min(280px, 78vw);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: #101012;
        color: var(--text);
        padding: 10px 12px;
        font-size: 0.76rem;
        line-height: 1.45;
        text-align: left;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition:
          opacity 140ms ease,
          transform 140ms ease;
      }

      .info-mark:hover::after,
      .info-mark:focus-visible::after {
        opacity: 1;
        transform: translateY(0);
      }

      select,
      input,
      button {
        font: inherit;
      }

      select,
      input[type="number"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
        color: var(--text);
        padding: 10px 12px;
        outline: none;
      }

      select:focus-visible,
      input:focus-visible,
      button:focus-visible {
        border-color: var(--line-strong);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      input[type="color"] {
        width: 100%;
        height: 36px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel-2);
      }

      .colors {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .color-field {
        display: grid;
        gap: 6px;
      }

      .seed-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 92px;
      }

      .motion-help {
        margin: -2px 0 0;
        color: var(--muted);
        font-size: 0.74rem;
        line-height: 1.4;
      }

      .button-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid var(--line);
        background: #e5e7eb;
        color: #09090b;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: #ffffff;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
      }

      button.secondary:hover {
        background: var(--accent-soft);
      }

      button:disabled,
      input:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .feedback {
        border: 1px solid var(--line);
        background: #101012;
        border-radius: 12px;
        padding: 10px 12px;
        display: grid;
        gap: 6px;
      }

      .feedback strong {
        font-size: 0.78rem;
        font-weight: 600;
      }

      .feedback p,
      .feedback pre {
        margin: 0;
        font-size: 0.78rem;
        line-height: 1.45;
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .feedback[data-state="error"] {
        border-color: rgba(252, 165, 165, 0.35);
      }

      .feedback[data-state="error"] p,
      .feedback[data-state="error"] pre {
        color: var(--danger);
      }

      .preview {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: #050505;
      }

      #meshLayer,
      #grainLayer {
        position: absolute;
        pointer-events: none;
      }

      #meshLayer {
        inset: -18%;
        transform-origin: 50% 50%;
        backface-visibility: hidden;
        will-change: transform;
        background-color: #0b0b0c;
        background-image:
          radial-gradient(circle at 12% 18%, #c2e812 0, transparent 34%),
          radial-gradient(circle at 86% 16%, #ff7f11 0, transparent 32%),
          radial-gradient(circle at 70% 82%, #ee4266 0, transparent 36%),
          radial-gradient(circle at 20% 88%, #2a1e5c 0, transparent 32%),
          linear-gradient(135deg, #c2e812, #ff7f11, #ee4266, #2a1e5c, #0f1020);
        background-size: 120% 120%;
        background-position: center;
        filter: blur(36px) saturate(1.2);
        transform: scale(1.12);
      }

      #grainLayer {
        inset: -8%;
        mix-blend-mode: overlay;
        opacity: 0.34;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;
        will-change: background-image, opacity, mix-blend-mode;
      }

      #meshLayer[data-motion="drift"] {
        animation: mesh-drift var(--motion-duration, 32s) ease-in-out infinite alternate;
      }

      #meshLayer[data-motion="breathe"] {
        animation: mesh-breathe var(--motion-duration, 32s) ease-in-out infinite alternate;
      }

      #meshLayer[data-motion="orbit"] {
        animation: mesh-orbit var(--motion-duration, 32s) ease-in-out infinite alternate;
      }

      @keyframes mesh-drift {
        from {
          transform: var(--mesh-transform) scale(var(--motion-zoom))
            translate3d(calc(var(--motion-travel) * -1), calc(var(--motion-travel) * -1), 0);
        }
        to {
          transform: var(--mesh-transform) scale(var(--motion-zoom))
            translate3d(var(--motion-travel), var(--motion-travel), 0);
        }
      }

      @keyframes mesh-breathe {
        from {
          transform: var(--mesh-transform);
          filter: var(--mesh-filter);
        }
        to {
          transform: var(--mesh-transform) scale(var(--motion-zoom));
          filter: var(--mesh-filter-strong);
        }
      }

      @keyframes mesh-orbit {
        from {
          transform: var(--mesh-transform) scale(var(--motion-zoom))
            rotate(calc(var(--motion-rotate) * -1))
            translate3d(calc(var(--motion-travel) * -1), var(--motion-travel), 0);
          background-position: 46% 54%;
        }
        to {
          transform: var(--mesh-transform) scale(var(--motion-zoom)) rotate(var(--motion-rotate))
            translate3d(var(--motion-travel), calc(var(--motion-travel) * -1), 0);
          background-position: 54% 46%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #meshLayer {
          animation: none !important;
        }
      }

      .preview-fallback {
        position: absolute;
        inset: 0;
        background: #0b0b0c;
      }

      @media (max-width: 940px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .preview {
          min-height: 68vh;
        }
      }

      @media (max-width: 560px) {
        .sidebar {
          padding: 14px;
        }
        .colors,
        .seed-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <h1>grain-gradient playground</h1>
          <p>Live preview for mesh + SVG grain motion. Copy export CSS when ready.</p>
        </div>

        <section class="controls card" aria-label="Gradient controls">
          <div class="field">
            <div class="label-row">
              <label for="preset">Preset</label>
            </div>
            <select id="preset"></select>
          </div>

          <div class="field">
            <div class="label-row">
              <label>Colors</label>
              <span class="value">4</span>
            </div>
            <div class="colors">
              <label class="color-field"
                ><span class="value">Color 1</span
                ><input id="color-1" type="color" aria-label="Color 1"
              /></label>
              <label class="color-field"
                ><span class="value">Color 2</span
                ><input id="color-2" type="color" aria-label="Color 2"
              /></label>
              <label class="color-field"
                ><span class="value">Color 3</span
                ><input id="color-3" type="color" aria-label="Color 3"
              /></label>
              <label class="color-field"
                ><span class="value">Color 4</span
                ><input id="color-4" type="color" aria-label="Color 4"
              /></label>
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="distortion">Distortion</label>
              <span class="value" id="distortion-value"></span>
            </div>
            <input id="distortion" type="range" min="0" max="100" step="1" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="swirl">Swirl</label>
              <span class="value" id="swirl-value"></span>
            </div>
            <input id="swirl" type="range" min="0" max="100" step="1" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="motionPreset">Motion preset</label>
            </div>
            <select id="motionPreset">
              <option value="none">Static</option>
              <option value="drift">Slow drift</option>
              <option value="breathe">Soft breathe</option>
              <option value="orbit">Gentle orbit</option>
            </select>
            <p class="motion-help">
              Pick one preset for movement, then fine-tune speed and intensity.
            </p>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="motionSpeed">Motion speed</label>
              <span class="value" id="motionSpeed-value"></span>
            </div>
            <input id="motionSpeed" type="range" min="0" max="100" step="1" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="motionIntensity">Motion intensity</label>
              <span class="value" id="motionIntensity-value"></span>
            </div>
            <input id="motionIntensity" type="range" min="0" max="100" step="1" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="grainOpacity">Grain opacity</label>
              <span class="value" id="grainOpacity-value"></span>
            </div>
            <input id="grainOpacity" type="range" min="0" max="1" step="0.01" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="grainDensity">Grain density</label>
              <span class="value" id="grainDensity-value"></span>
            </div>
            <input id="grainDensity" type="range" min="0" max="100" step="1" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="contrast">SVG contrast</label>
              <span class="value" id="contrast-value"></span>
            </div>
            <input id="contrast" type="range" min="1" max="2.5" step="0.01" />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="blendMode">Blend mode</label>
            </div>
            <select id="blendMode">
              <option value="overlay">overlay</option>
              <option value="soft-light">soft-light</option>
              <option value="screen">screen</option>
              <option value="multiply">multiply</option>
              <option value="normal">normal</option>
            </select>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="androidCanvasFallback">Android canvas fallback</label>
              <span
                class="info-mark"
                tabindex="0"
                data-tooltip="Android Chrome only can render SVG turbulence backgrounds with visible artifacts, so this switches the grain layer to a Canvas-generated PNG fallback."
                aria-label="Android Chrome only can render SVG turbulence backgrounds with visible artifacts, so this switches the grain layer to a Canvas-generated PNG fallback."
                >i</span
              >
            </div>
            <select id="androidCanvasFallback">
              <option value="auto">auto</option>
              <option value="off">off</option>
              <option value="on">on</option>
            </select>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="seedRange">Seed</label>
              <span class="value" id="seed-value"></span>
            </div>
            <div class="seed-grid">
              <input id="seedRange" type="range" min="0" max="9999" step="1" />
              <input id="seedNumber" type="number" min="0" max="9999" step="1" />
            </div>
          </div>

          <div class="button-row">
            <button id="copyCss" type="button">Copy CSS</button>
            <button id="reset" class="secondary" type="button">Reset preset</button>
          </div>

          <div class="feedback" id="feedback" data-state="ready" aria-live="polite">
            <strong id="feedback-title">Ready</strong>
            <p id="feedback-text">Preview is live.</p>
            <pre id="feedback-error" hidden></pre>
          </div>
        </section>
      </aside>

      <main class="preview" aria-label="Live background preview">
        <div id="meshLayer"></div>
        <div id="grainLayer"></div>
      </main>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id);

      const elements = {
        preset: $("preset"),
        colors: [$("color-1"), $("color-2"), $("color-3"), $("color-4")],
        distortion: $("distortion"),
        swirl: $("swirl"),
        motionPreset: $("motionPreset"),
        motionSpeed: $("motionSpeed"),
        motionIntensity: $("motionIntensity"),
        grainOpacity: $("grainOpacity"),
        grainDensity: $("grainDensity"),
        contrast: $("contrast"),
        blendMode: $("blendMode"),
        androidCanvasFallback: $("androidCanvasFallback"),
        seedRange: $("seedRange"),
        seedNumber: $("seedNumber"),
        copyCss: $("copyCss"),
        reset: $("reset"),
        feedback: $("feedback"),
        feedbackTitle: $("feedback-title"),
        feedbackText: $("feedback-text"),
        feedbackError: $("feedback-error"),
        distortionValue: $("distortion-value"),
        swirlValue: $("swirl-value"),
        motionSpeedValue: $("motionSpeed-value"),
        motionIntensityValue: $("motionIntensity-value"),
        grainOpacityValue: $("grainOpacity-value"),
        grainDensityValue: $("grainDensity-value"),
        contrastValue: $("contrast-value"),
        seedValue: $("seed-value"),
        meshLayer: $("meshLayer"),
        grainLayer: $("grainLayer"),
      };

      const format = (value, digits = 2) => {
        const next = Number(value).toFixed(digits);
        return next.replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
      };

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const defaultMotionPreset = () =>
        window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "drift";

      const setFeedback = (state, title, text, error = "") => {
        elements.feedback.dataset.state = state;
        elements.feedbackTitle.textContent = title;
        elements.feedbackText.textContent = text;
        elements.feedbackError.hidden = !error;
        elements.feedbackError.textContent = error;
      };

      let api;

      try {
        const modulePath = import.meta.env?.DEV ? "../src/index.ts" : "../dist/index.js";
        api = await import(/* @vite-ignore */ modulePath);
      } catch (error) {
        setFeedback(
          "error",
          "Import failed",
          "Could not load grain-gradient module.",
          error?.stack || String(error),
        );
        throw error;
      }

      const { createMeshGradient, createTurbulenceNoise, createGrainGradientCSS, presets } = api;

      const presetNames = Object.keys(presets);
      elements.preset.innerHTML = presetNames
        .map((name) => `<option value="${name}">${name}</option>`)
        .join("");

      const initialPreset = "Aurora Citrus";
      const initial = presets[initialPreset];

      const state = {
        preset: initialPreset,
        colors: [...initial.colors],
        baseColor: initial.baseColor,
        distortion: 44,
        swirl: 30,
        grainOpacity: 0.34,
        grainDensity: 90,
        contrast: 1.7,
        seed: 1,
        blendMode: "overlay",
        motionPreset: defaultMotionPreset(),
        motionSpeed: 38,
        motionIntensity: 46,
        androidCanvasFallback: "auto",
      };

      const isAndroidChrome = () => {
        const ua = navigator.userAgent;
        return (
          /Android/i.test(ua) &&
          /Chrome\//i.test(ua) &&
          !/(; wv|Version\/|EdgA|OPR|SamsungBrowser|Firefox|CriOS)/i.test(ua)
        );
      };

      const useCanvasFallback = () => {
        if (state.androidCanvasFallback === "on") return true;
        if (state.androidCanvasFallback === "off") return false;
        return isAndroidChrome();
      };

      const densityToFrequency = (density) => {
        const progress = clamp(density, 0, 100) / 100;
        return 0.04 + progress * progress * (2.4 - 0.04);
      };

      const densityToCanvasSize = (density) => Math.round(720 - clamp(density, 0, 100) * 5.8);

      const createCanvasNoise = ({ seed, density, contrast }) => {
        const size = 1024;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext("2d", { alpha: false });
        const image = context.createImageData(size, size);
        let value = Math.floor(Number.isFinite(seed) ? seed : 1) >>> 0;
        const nextRandom = () => {
          value = (value * 1664525 + 1013904223) >>> 0;
          return value / 4294967296;
        };
        const threshold = 0.5;
        const grainContrast = clamp(contrast / 2.5, 0.35, 1);
        const blockSize = Math.max(1, Math.round(2.25 - (clamp(density, 0, 100) / 100) * 1.25));

        for (let y = 0; y < size; y += blockSize) {
          for (let x = 0; x < size; x += blockSize) {
            const bit = nextRandom() > threshold ? 1 : 0;
            const channel = Math.round(128 + (bit ? 127 : -127) * grainContrast);
            for (let yy = 0; yy < blockSize; yy++) {
              for (let xx = 0; xx < blockSize; xx++) {
                const px = x + xx;
                const py = y + yy;
                if (px >= size || py >= size) continue;
                const offset = (py * size + px) * 4;
                image.data[offset] = channel;
                image.data[offset + 1] = channel;
                image.data[offset + 2] = channel;
                image.data[offset + 3] = 255;
              }
            }
          }
        }

        context.putImageData(image, 0, 0);
        return `url("${canvas.toDataURL("image/png")}")`;
      };

      const syncInputs = () => {
        elements.preset.value = state.preset;
        elements.colors.forEach((input, index) => {
          input.value = state.colors[index];
        });
        elements.distortion.value = String(state.distortion);
        elements.swirl.value = String(state.swirl);
        elements.motionPreset.value = state.motionPreset;
        elements.motionSpeed.value = String(state.motionSpeed);
        elements.motionIntensity.value = String(state.motionIntensity);
        elements.grainOpacity.value = String(state.grainOpacity);
        elements.grainDensity.value = String(state.grainDensity);
        elements.contrast.value = String(state.contrast);
        elements.seedRange.value = String(state.seed);
        elements.seedNumber.value = String(state.seed);
        elements.blendMode.value = state.blendMode;
        elements.androidCanvasFallback.value = state.androidCanvasFallback;
      };

      const syncLabels = () => {
        elements.distortionValue.textContent = `${state.distortion}`;
        elements.swirlValue.textContent = `${state.swirl}`;
        elements.motionSpeedValue.textContent =
          state.motionPreset === "none" || state.motionSpeed === 0
            ? "static"
            : `${state.motionSpeed}`;
        elements.motionIntensityValue.textContent = `${state.motionIntensity}`;
        elements.grainOpacityValue.textContent = format(state.grainOpacity, 2);
        elements.grainDensityValue.textContent = `${state.grainDensity}`;
        elements.contrastValue.textContent = format(state.contrast, 2);
        elements.seedValue.textContent = String(state.seed);
      };

      const applyPreset = (name) => {
        const preset = presets[name];
        if (!preset) return;
        state.preset = name;
        state.colors = [...preset.colors];
        state.baseColor = preset.baseColor;
        syncInputs();
        render();
      };

      const syncSeed = (value) => {
        const next = clamp(Math.round(Number(value) || 0), 0, 9999);
        state.seed = next;
        elements.seedRange.value = String(next);
        elements.seedNumber.value = String(next);
        render();
      };

      const render = () => {
        try {
          const meshBackground = createMeshGradient({
            colors: state.colors,
            baseColor: state.baseColor,
            blur: 8 + state.distortion * 0.65,
            intensity: 1.05 + state.distortion / 110,
            saturation: 1 + state.distortion / 160,
          });

          const swirlShift = state.swirl / 100;
          const swirlScale = 1 + state.swirl * 0.004;
          const motionEnabled =
            state.motionPreset !== "none" && state.motionSpeed > 0 && state.motionIntensity > 0;
          const motionDuration = Math.max(10, Math.round(56 - state.motionSpeed * 0.46));
          const motionTravel = 4 + state.motionIntensity * 0.16;
          const motionZoom = 1 + state.motionIntensity * 0.0016;
          const motionRotate = state.motionIntensity * 0.12;
          const grainFrequency = densityToFrequency(state.grainDensity);
          const canvasGrainSize = densityToCanvasSize(state.grainDensity);
          const meshFilter = `blur(${state.distortion * 0.75}px) saturate(${1.05 + state.distortion / 160}) contrast(${1 + state.distortion / 260})`;
          const meshTransform = `scale(${swirlScale}) rotate(${state.swirl * 0.12}deg)`;

          elements.meshLayer.style.backgroundImage = meshBackground;
          elements.meshLayer.style.backgroundRepeat = "no-repeat";
          elements.meshLayer.style.backgroundSize = `${100 + state.swirl * 0.55}% ${100 + state.swirl * 0.4}%`;
          elements.meshLayer.style.backgroundPosition = `${50 + swirlShift * 12}% ${50 - swirlShift * 10}%`;
          elements.meshLayer.style.filter = meshFilter;
          elements.meshLayer.style.transform = meshTransform;
          elements.meshLayer.style.setProperty("--mesh-filter", meshFilter);
          elements.meshLayer.style.setProperty(
            "--mesh-filter-strong",
            `blur(${Math.min(80, state.distortion * 0.75 + motionTravel)}px) saturate(${1.12 + state.distortion / 140}) contrast(${1.03 + state.distortion / 240})`,
          );
          elements.meshLayer.style.setProperty("--mesh-transform", meshTransform);
          elements.meshLayer.style.setProperty("--motion-duration", `${motionDuration}s`);
          elements.meshLayer.style.setProperty("--motion-travel", `${motionTravel}%`);
          elements.meshLayer.style.setProperty("--motion-zoom", `${motionZoom}`);
          elements.meshLayer.style.setProperty("--motion-rotate", `${motionRotate}deg`);
          elements.meshLayer.dataset.motion = motionEnabled ? state.motionPreset : "none";

          const canvasFallback = useCanvasFallback();
          elements.grainLayer.style.backgroundImage = canvasFallback
            ? createCanvasNoise({
                seed: state.seed,
                density: state.grainDensity,
                contrast: state.contrast,
              })
            : createTurbulenceNoise({
                seed: state.seed,
                frequency: grainFrequency,
                contrast: state.contrast,
              });
          elements.grainLayer.style.backgroundSize = canvasFallback
            ? `${canvasGrainSize}px ${canvasGrainSize}px`
            : "100% 100%";
          elements.grainLayer.style.backgroundRepeat = canvasFallback ? "repeat" : "no-repeat";
          elements.grainLayer.style.imageRendering = canvasFallback ? "pixelated" : "auto";
          elements.grainLayer.style.opacity = String(state.grainOpacity);
          elements.grainLayer.style.mixBlendMode = state.blendMode;
          elements.grainLayer.dataset.motion = "none";

          syncLabels();
          setFeedback("ready", "Ready", "Preview is live.");
        } catch (error) {
          elements.meshLayer.style.backgroundImage = "none";
          elements.meshLayer.style.filter = "none";
          elements.meshLayer.style.transform = "none";
          elements.grainLayer.style.backgroundImage = "none";
          setFeedback(
            "error",
            "Render failed",
            "The preview could not be rendered.",
            error?.stack || String(error),
          );
        }
      };

      syncInputs();
      render();

      elements.preset.addEventListener("change", (event) => applyPreset(event.target.value));

      elements.colors.forEach((input, index) => {
        input.addEventListener("input", (event) => {
          state.colors[index] = event.target.value;
          render();
        });
      });

      elements.distortion.addEventListener("input", (event) => {
        state.distortion = Number(event.target.value);
        render();
      });

      elements.swirl.addEventListener("input", (event) => {
        state.swirl = Number(event.target.value);
        render();
      });

      elements.motionPreset.addEventListener("change", (event) => {
        state.motionPreset = event.target.value;
        render();
      });

      elements.motionSpeed.addEventListener("input", (event) => {
        state.motionSpeed = Number(event.target.value);
        render();
      });

      elements.motionIntensity.addEventListener("input", (event) => {
        state.motionIntensity = Number(event.target.value);
        render();
      });

      elements.grainOpacity.addEventListener("input", (event) => {
        state.grainOpacity = Number(event.target.value);
        render();
      });

      elements.grainDensity.addEventListener("input", (event) => {
        state.grainDensity = Number(event.target.value);
        render();
      });

      elements.contrast.addEventListener("input", (event) => {
        state.contrast = Number(event.target.value);
        render();
      });

      elements.blendMode.addEventListener("change", (event) => {
        state.blendMode = event.target.value;
        render();
      });

      elements.androidCanvasFallback.addEventListener("change", (event) => {
        state.androidCanvasFallback = event.target.value;
        render();
      });

      elements.seedRange.addEventListener("input", (event) => syncSeed(event.target.value));
      elements.seedNumber.addEventListener("input", (event) => syncSeed(event.target.value));

      elements.reset.addEventListener("click", () => {
        applyPreset(initialPreset);
        state.distortion = 44;
        state.swirl = 30;
        state.grainOpacity = 0.34;
        state.grainDensity = 90;
        state.contrast = 1.7;
        state.seed = 1;
        state.blendMode = "overlay";
        state.motionPreset = defaultMotionPreset();
        state.motionSpeed = 38;
        state.motionIntensity = 46;
        state.androidCanvasFallback = "auto";
        syncInputs();
        render();
      });

      elements.copyCss.addEventListener("click", async () => {
        try {
          const css = createGrainGradientCSS({
            selector: ".grain-gradient",
            colors: state.colors,
            baseColor: state.baseColor,
            blur: 8 + state.distortion * 0.65,
            intensity: 1.05 + state.distortion / 110,
            saturation: 1 + state.distortion / 160,
            swirl: state.swirl,
            seed: state.seed,
            frequency: densityToFrequency(state.grainDensity),
            contrast: state.contrast,
            opacity: state.grainOpacity,
            blendMode: state.blendMode,
            motionPreset: state.motionPreset,
            motionSpeed: state.motionSpeed,
            motionIntensity: state.motionIntensity,
          });

          await navigator.clipboard.writeText(css);
          setFeedback("ready", "Copied", "Export CSS copied to clipboard.");
          window.setTimeout(() => setFeedback("ready", "Ready", "Preview is live."), 1400);
        } catch (error) {
          setFeedback(
            "error",
            "Copy failed",
            "The browser blocked clipboard access.",
            error?.stack || String(error),
          );
        }
      });
    </script>
  </body>
</html>
